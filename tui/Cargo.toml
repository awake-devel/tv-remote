[package]
name = "tv-remote-tui"
version.workspace = true
edition.workspace = true
description = "Terminal UI and CLI for the living-room Samsung TV"

[[bin]]
name = "tv-remote-tui"
path = "src/main.rs"

[dependencies]
tvremote_core = { path = "../core" }
# ratatui 0.30 re-exports a matching crossterm as `ratatui::crossterm`; we use that
# re-export so the two versions can never drift apart.
ratatui = "0.30.2"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.4"
serde = "1.0.219"
serde_json = "1.0.140"
