[package]
name = "tvremote_core"
version.workspace = true
edition.workspace = true
description = "Blocking, thread-safe control library for a Samsung Tizen TV (remote WebSocket, REST, DLNA cast, DIAL, WoL, SmartThings)"

[lib]
name = "tvremote_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
base64 = "0.22.1"
native-tls = "0.2.14"
tungstenite = { version = "0.24.0", features = ["native-tls"] }
ureq = { version = "2.12.1", default-features = false, features = ["json", "native-tls"] }
