[package]
name = "tvremote-ffi"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "UniFFI bindings of tvremote_core for the Android app"
publish = false

[lib]
name = "tvremote_ffi"
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# Generates the Kotlin bindings from the built library (same uniffi version as the crate).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
# rustls instead of OpenSSL: nothing to cross-compile but Rust (and ring's C/asm via the NDK clang).
tvremote_core = { path = "../../core", default-features = false, features = ["rustls"] }
uniffi = "0.32.2"
thiserror = "2.0.12"
serde_json = "1.0.140"

[build-dependencies]

# Not a member of the root workspace (see the root Cargo.toml): its own Cargo.lock and
# target/, so the core's `rustls` feature never leaks into the desktop builds.
[workspace]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "unwind"
